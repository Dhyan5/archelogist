# Spring Boot Application Properties for Software Archaeologist
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:software_archaeologist}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Upload File Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Analyzer Microservice Integration
analyzer.service.url=${ANALYZER_SERVICE_URL:http://localhost:8000}
analyzer.workspace.dir=${WORKSPACE_DIR:./tmp/workspace}

# JWT Token Configuration
app.jwt.secret=${JWT_SECRET:super_secret_jwt_key_software_archaeologist_2026_production_grade_security_key_38_phases}
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.archaeologist.api=DEBUG
